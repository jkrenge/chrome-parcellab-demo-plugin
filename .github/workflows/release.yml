name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump patch version
        id: version
        run: |
          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          while git rev-parse -q --verify "refs/tags/$version" > /dev/null; do
            npm version patch --no-git-tag-version
            version=$(node -p "require('./package.json').version")
          done
          node -e 'const fs = require("node:fs"); const path = "public/manifest.json"; const text = fs.readFileSync(path, "utf8"); fs.writeFileSync(path, text.replace(/("version": ")[^"]+/, "$1" + process.argv[1]));' "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Create bundle
        run: |
          cd dist
          zip -qr "$RUNNER_TEMP/chrome-parcellab-demo-plugin-${{ steps.version.outputs.value }}-bundle.zip" .
      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: release ${{ steps.version.outputs.value }}"
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.value }}" \
            "$RUNNER_TEMP/chrome-parcellab-demo-plugin-${{ steps.version.outputs.value }}-bundle.zip" \
            --verify-tag \
            --title "${{ steps.version.outputs.value }}" \
            --generate-notes
